name: omnelyo-frontend

services:
  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must reference an immutable SHA tag}
    container_name: omnelyo-frontend
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 30s
