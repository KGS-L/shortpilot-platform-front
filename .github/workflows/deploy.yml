name: Deploy frontend staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  HEALTHCHECK_URL: http://127.0.0.1:3000/
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
  NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
  NEXT_PUBLIC_ENVIRONMENT: ${{ vars.NEXT_PUBLIC_ENVIRONMENT }}
  NEXT_PUBLIC_INDEXING_ENABLED: "false"

jobs:
  publish:
    name: Validate, build and publish
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    outputs:
      image: ${{ steps.image.outputs.ref }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4

      - name: Resolve source revision
        id: source
        run: |
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate public staging variables
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_API_URL" || { echo "NEXT_PUBLIC_API_URL is required." >&2; exit 1; }
          test -n "$NEXT_PUBLIC_APP_URL" || { echo "NEXT_PUBLIC_APP_URL is required." >&2; exit 1; }
          test -n "$NEXT_PUBLIC_SITE_URL" || { echo "NEXT_PUBLIC_SITE_URL is required." >&2; exit 1; }
          test "$NEXT_PUBLIC_ENVIRONMENT" = "staging" || { echo "NEXT_PUBLIC_ENVIRONMENT must be staging." >&2; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build production frontend
        run: npm run build

      - name: Resolve immutable image name
        id: image
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          image_name="${OWNER,,}/omnelyo-frontend"
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "ref=${REGISTRY}/${image_name}:${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish production image
        id: docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:staging-latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_ENVIRONMENT=${{ vars.NEXT_PUBLIC_ENVIRONMENT }}
            NEXT_PUBLIC_INDEXING_ENABLED=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

  deploy:
    name: Deploy on self-hosted VPS
    needs: publish
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Check out code on VPS runner
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.source_sha }}

      - name: Install deployment manifests locally
        env:
          VPS_FRONTEND_PATH: ${{ secrets.VPS_FRONTEND_PATH }}
        run: |
          set -euo pipefail
          test -n "$VPS_FRONTEND_PATH" || { echo "VPS_FRONTEND_PATH is required." >&2; exit 1; }
          install -d -m 750 "$VPS_FRONTEND_PATH" "$VPS_FRONTEND_PATH/scripts" "$VPS_FRONTEND_PATH/deploy"
          install -m 640 compose.staging.yml "$VPS_FRONTEND_PATH/"
          if [ -d scripts ]; then
            install -m 750 scripts/*.sh "$VPS_FRONTEND_PATH/scripts/"
          fi

      - name: Deploy immutable image and verify health
        env:
          VPS_FRONTEND_PATH: ${{ secrets.VPS_FRONTEND_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          TARGET_IMAGE: ${{ needs.publish.outputs.image }}
          HEALTHCHECK_URL: ${{ env.HEALTHCHECK_URL }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          cd "$VPS_FRONTEND_PATH"

          compose=(docker compose -f compose.staging.yml)
          state_file=.deployed-frontend-image
          previous_image=""
          if [[ -f "$state_file" ]]; then
            previous_image="$(tr -d '\r\n' < "$state_file")"
          fi

          rollback() {
            trap - ERR
            if [[ -n "$previous_image" && "$previous_image" != "$TARGET_IMAGE" ]]; then
              echo "Healthcheck en échec, retour à l'image précédente : $previous_image" >&2
              FRONTEND_IMAGE="$previous_image" "${compose[@]}" up -d --no-deps --force-recreate frontend
            fi
          }
          trap rollback ERR

          echo "Pulling target image: $TARGET_IMAGE"
          FRONTEND_IMAGE="$TARGET_IMAGE" "${compose[@]}" pull frontend
          echo "Recreating frontend service..."
          FRONTEND_IMAGE="$TARGET_IMAGE" "${compose[@]}" up -d --no-deps --force-recreate frontend

          healthy=false
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --max-time 10 "$HEALTHCHECK_URL" >/dev/null; then
              healthy=true
              echo "Healthcheck local réussi sur $HEALTHCHECK_URL"
              break
            fi
            sleep 3
          done

          if [[ "$healthy" != true ]]; then
            echo "Le healthcheck a échoué après 60 secondes." >&2
            exit 1
          fi

          printf '%s\n' "$TARGET_IMAGE" > "$state_file"
          trap - ERR
          "${compose[@]}" ps
          docker image prune -f --filter "until=168h"
