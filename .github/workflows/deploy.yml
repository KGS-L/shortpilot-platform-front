name: Deploy frontend staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: omnelyo-frontend-staging
  cancel-in-progress: false

env:
  HEALTHCHECK_URL: https://omnelyo.kgslab.com
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
  NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
  NEXT_PUBLIC_ENVIRONMENT: ${{ vars.NEXT_PUBLIC_ENVIRONMENT }}
  NEXT_PUBLIC_INDEXING_ENABLED: "false"

jobs:
  validate-build-publish-deploy:
    name: Validate, publish and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4

      - name: Validate public staging variables
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_API_URL" || { echo "NEXT_PUBLIC_API_URL is required." >&2; exit 1; }
          test -n "$NEXT_PUBLIC_APP_URL" || { echo "NEXT_PUBLIC_APP_URL is required." >&2; exit 1; }
          test -n "$NEXT_PUBLIC_SITE_URL" || { echo "NEXT_PUBLIC_SITE_URL is required." >&2; exit 1; }
          test "$NEXT_PUBLIC_ENVIRONMENT" = "staging" || { echo "NEXT_PUBLIC_ENVIRONMENT must be staging." >&2; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build production frontend
        run: npm run build

      - name: Compute lowercase GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish production image
        id: docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:staging-latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_ENVIRONMENT=${{ vars.NEXT_PUBLIC_ENVIRONMENT }}
            NEXT_PUBLIC_INDEXING_ENABLED=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Configure strict SSH trust
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/omnelyo_deploy"
          chmod 600 "$HOME/.ssh/omnelyo_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Validate VPS deployment secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_FRONTEND_PATH: ${{ secrets.VPS_FRONTEND_PATH }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "VPS_HOST is required." >&2; exit 1; }
          test -n "$VPS_PORT" || { echo "VPS_PORT is required." >&2; exit 1; }
          test -n "$VPS_USER" || { echo "VPS_USER is required." >&2; exit 1; }
          test -n "$VPS_FRONTEND_PATH" || { echo "VPS_FRONTEND_PATH is required." >&2; exit 1; }

      - name: Copy frontend-only deployment files
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_FRONTEND_PATH: ${{ secrets.VPS_FRONTEND_PATH }}
        run: |
          set -euo pipefail
          scp -P "$VPS_PORT" \
            -i "$HOME/.ssh/omnelyo_deploy" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            compose.staging.yml deploy/deploy-frontend.sh \
            "$VPS_USER@$VPS_HOST:$VPS_FRONTEND_PATH/"

      - name: Authenticate VPS to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_FRONTEND_PATH: ${{ secrets.VPS_FRONTEND_PATH }}
        run: |
          set -euo pipefail
          printf -v remote_path_q '%q' "$VPS_FRONTEND_PATH"
          printf '%s' "$GHCR_TOKEN" | ssh -p "$VPS_PORT" \
            -i "$HOME/.ssh/omnelyo_deploy" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" \
            "install -d -m 700 $remote_path_q/.docker-deploy && DOCKER_CONFIG=$remote_path_q/.docker-deploy docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"

      - name: Deploy immutable image with automatic rollback
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.docker.outputs.digest }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_FRONTEND_PATH: ${{ secrets.VPS_FRONTEND_PATH }}
        run: |
          set -euo pipefail
          image_ref="$IMAGE_NAME@$IMAGE_DIGEST"
          printf -v remote_path_q '%q' "$VPS_FRONTEND_PATH"
          printf -v image_ref_q '%q' "$image_ref"
          printf -v healthcheck_q '%q' "$HEALTHCHECK_URL"
          ssh -p "$VPS_PORT" \
            -i "$HOME/.ssh/omnelyo_deploy" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" \
            "cd $remote_path_q && DOCKER_CONFIG=$remote_path_q/.docker-deploy sh deploy-frontend.sh $image_ref_q $healthcheck_q"

      - name: Verify public staging health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 "$HEALTHCHECK_URL" >/dev/null; then
              echo "Public frontend healthcheck passed."
              exit 0
            fi
            sleep 5
          done
          echo "Public frontend healthcheck failed after 60 seconds." >&2
          exit 1

      - name: Remove temporary VPS registry credentials
        if: always()
        continue-on-error: true
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_FRONTEND_PATH: ${{ secrets.VPS_FRONTEND_PATH }}
        run: |
          printf -v remote_path_q '%q' "$VPS_FRONTEND_PATH"
          ssh -p "$VPS_PORT" \
            -i "$HOME/.ssh/omnelyo_deploy" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" \
            "DOCKER_CONFIG=$remote_path_q/.docker-deploy docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf $remote_path_q/.docker-deploy"
