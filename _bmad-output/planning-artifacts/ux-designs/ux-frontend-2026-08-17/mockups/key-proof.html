<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omnelyo — Mock preuve « Raconté, pas découpé »</title>
<style>
/* ============================================================
   key-proof.html — Section Preuve « Raconté, pas découpé » (canvas 360px)
   Gouverné par :
   - EXPERIENCE.md → Information Architecture row 2 (Preuve « Raconté, pas
     découpé »), Component Patterns « Preuve avant/après » (statique, codé,
     lisible sans scroll horizontal en 360px, fonctionne sans JS),
     Responsive & Platform < 768px (cartes empilées, rotations réduites ±2°)
   - DESIGN.md → Components card-tilted (papier, bordure encre 4px, radius 32px,
     ombre 0 25px 50px -12px rgba(23,32,51,.15)) / pill-tag,
     Typography display-lg / headline / label-caps / caption,
     Colors (fond crème #FBFAF6, traits #172033, accents lime ;
     orange = point du logo + UN mot clé « Raconté »),
     Geist Mono → mono système pour les données techniques (durées, tailles)
   Statique : décor = blobs CSS flous uniquement, aucune image, aucune vidéo,
   aucun JS, aucune requête réseau.
   ============================================================ */

:root{
  --cream:#FBFAF6;
  --paper:#FFFFFF;
  --ink:#172033;
  --lime:#A3E635;
  --lime-strong:#84CC16;
  --lime-soft:#ECFCCB;
  --orange:#F97316;
  --muted:#475569;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#E9E7DF;
  font-family:var(--font-sans);
  color:var(--ink);
  padding:44px 28px 60px;
  -webkit-font-smoothing:antialiased;
}

.studio-note{
  text-align:center;
  font-size:12px;
  font-weight:600;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#75726A;
  margin-bottom:30px;
}

.studio{
  display:flex;
  flex-wrap:wrap;
  gap:52px;
  justify-content:center;
  align-items:flex-start;
}

.rig{width:360px}

.browser{
  width:360px;
  border-radius:20px;
  overflow:hidden;
  background:#F2F1EB;
  border:1px solid rgba(23,32,51,.14);
  box-shadow:0 30px 60px -22px rgba(23,32,51,.38);
}

.chrome{
  display:flex;
  align-items:center;
  gap:7px;
  padding:10px 14px;
  background:#E4E2D9;
  border-bottom:1px solid rgba(23,32,51,.12);
}
.chrome i{width:9px;height:9px;border-radius:50%;background:#C7C4B8;display:block}
.chrome .url{
  flex:1;
  text-align:center;
  font-size:11px;
  letter-spacing:.02em;
  color:#79766C;
  background:#F4F3EE;
  border-radius:999px;
  padding:4px 12px;
  margin-left:4px;
}

/* --- canvas téléphone 360px, position scrollée : la nav fixe reste visible --- */
.screen{
  position:relative;
  width:360px;
  height:860px;
  background:var(--cream);
  color:var(--ink);
  overflow:hidden;
}

/* blobs décoratifs CSS (flous) — la seule richesse, zéro asset */
.blob{position:absolute;border-radius:50%;filter:blur(52px);pointer-events:none;z-index:0}
.blob-a{width:280px;height:280px;background:rgba(236,252,203,.9);top:150px;right:-90px}
.blob-b{width:190px;height:190px;background:rgba(163,230,53,.28);bottom:60px;left:-80px}

/* nav fixe (row 0, état déconnecté) */
.nav{
  position:relative;
  z-index:3;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:0 18px;
  height:62px;
  background:rgba(251,250,246,.92);
  border-bottom:1px solid rgba(23,32,51,.14);
  white-space:nowrap;
}
.logo{font-size:1.08rem;font-weight:800;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.logo .dot{color:var(--orange)} /* orange : point du logo uniquement ici */
.auth{display:flex;align-items:center;gap:6px}
.auth .ghost{
  font-size:.8rem;font-weight:600;color:var(--ink);text-decoration:none;
  padding:12px 4px;display:inline-block;
}
.auth .pill{
  font-size:.76rem;font-weight:700;color:var(--ink);text-decoration:none;
  border:1.5px solid var(--ink);border-radius:999px;
  padding:11px 14px;display:inline-block;
}

/* --- section preuve (row 2) --- */
.proof{position:relative;z-index:1;padding:38px 20px 44px}

.kicker{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:13px;              /* label-caps */
  font-weight:600;
  letter-spacing:.1em;
  color:var(--muted);
}
.kicker .dash{width:26px;height:4px;border-radius:2px;background:var(--lime-strong)}

.proof h2{
  margin-top:10px;
  font-size:2.2rem;            /* plancher du clamp(2.2rem,5vw,3.8rem) sur 360px */
  font-weight:900;
  line-height:1.1;
  letter-spacing:-0.045em;
  color:var(--ink);
}
.proof h2 em{font-style:normal;color:var(--orange)} /* l'UN mot clé */

/* cartes penchées empilées, rotations réduites ±2° (règle mobile) */
.card{
  background:var(--paper);
  border:4px solid var(--ink);
  border-radius:32px;
  box-shadow:0 25px 50px -12px rgba(23,32,51,.15);
  padding:18px 20px 20px;
}
.card-origin{position:relative;z-index:1;transform:rotate(-2deg)}
.card-short{
  position:relative;z-index:2;
  transform:rotate(2deg) translateX(8px);
  margin-top:-14px;            /* superposition penchée */
}

.card h3{
  font-size:1.5rem;            /* headline */
  font-weight:700;
  line-height:1.3;
  letter-spacing:-.01em;
}
.card-short h3 span{
  display:inline-block;
  border-bottom:5px solid var(--lime);
  padding-bottom:2px;
}

.badge{
  display:inline-block;
  margin-top:12px;
  font-family:var(--font-mono); /* données techniques en mono */
  font-size:1.35rem;
  font-weight:700;
  letter-spacing:-.01em;
  color:var(--ink);
  border:2px solid var(--ink);
  border-radius:999px;         /* pill-tag */
  padding:5px 16px;
}
.card-short .badge{background:var(--lime)}  /* accent lime sur le résultat */

/* mémo visuel codé : 47 minutes de rushes vs 58 secondes racontées */
.bar{height:12px;border-radius:999px;margin-top:16px}
.card-origin .bar{
  width:100%;
  background:repeating-linear-gradient(90deg,rgba(23,32,51,.26) 0 9px,transparent 9px 15px);
}
.card-short .bar{
  width:38%;
  background:repeating-linear-gradient(90deg,var(--lime-strong) 0 4px,var(--lime) 4px 8px);
}

.specs{margin-top:14px;display:grid;gap:8px;list-style:none}
.specs li{
  display:flex;
  align-items:flex-start;
  gap:10px;
  font-size:15px;
  line-height:1.45;
  color:var(--ink);
}
.specs i{
  flex:none;
  width:10px;height:10px;border-radius:50%;
  margin-top:5px;
  border:2px solid var(--ink);
  background:transparent;      /* carte d'origine : marqueurs neutres */
}
.card-short .specs i{background:var(--lime-strong)} /* carte racontée : lime */
.specs s{
  text-decoration:line-through;
  text-decoration-thickness:2px;
  text-decoration-color:rgba(23,32,51,.55);
}

/* ligne de contraste explicite */
.contrast{
  margin-top:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  font-size:1.3rem;
  font-weight:900;
  letter-spacing:-.03em;
  color:var(--ink);
}
.contrast .neq{
  flex:none;
  width:38px;height:38px;
  display:grid;place-items:center;
  background:var(--lime);
  border:2px solid var(--ink);
  border-radius:50%;
  font-size:1.05rem;
  font-weight:800;
}
.contrast .win{
  border-bottom:6px solid var(--lime);
  padding-bottom:1px;
}

figcaption{
  margin-top:14px;
  text-align:center;
  font-size:12px;
  font-weight:600;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:#6E6B63;
}
</style>
</head>
<body>

<p class="studio-note">Mock — Preuve · canvas 360px</p>

<main class="studio">

  <figure class="rig">
    <div class="browser">
      <div class="chrome"><i></i><i></i><i></i><span class="url">omnelyo.com</span></div>
      <div class="screen">
        <div class="blob blob-a"></div>
        <div class="blob blob-b"></div>

        <header class="nav">
          <a class="logo" href="#">Omnelyo<span class="dot">.</span></a>
          <nav class="auth">
            <a class="ghost" href="#">Se connecter</a>
            <a class="pill" href="#">Créer gratuitement</a>
          </nav>
        </header>

        <section class="proof" id="preuve">
          <p class="kicker"><span class="dash"></span>La preuve</p>
          <h2><em>Raconté</em>, pas découpé</h2>

          <article class="card card-origin" style="margin-top:26px">
            <h3>La vidéo d'origine</h3>
            <span class="badge">47:12</span>
            <div class="bar"></div>
            <ul class="specs">
              <li><i></i>audio d'origine</li>
              <li><i></i>1,8 Go</li>
            </ul>
          </article>

          <article class="card card-short">
            <h3><span>Le Short raconté</span></h3>
            <span class="badge">0:58</span>
            <div class="bar"></div>
            <ul class="specs">
              <li><i></i>histoire nouvelle</li>
              <li><i></i>voix off</li>
              <li><i></i><span><s>audio d'origine</s> retiré</span></li>
            </ul>
          </article>

          <p class="contrast">découper <span class="neq">≠</span> <span class="win">raconter</span></p>
        </section>
      </div>
    </div>
    <figcaption>Section 2 — Preuve « Raconté, pas découpé »</figcaption>
  </figure>

</main>

</body>
</html>
